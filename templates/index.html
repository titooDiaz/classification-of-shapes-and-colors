<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cámara del celular → PC</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #0b1020; color: #edf2ff; min-height: 100vh;
           display: grid; place-items: center; padding: 20px; box-sizing: border-box; }
    main { width: min(920px, 100%); }
    h1 { font-size: clamp(1.5rem, 4vw, 2.4rem); margin-bottom: .4rem; }
    p { color: #b9c4df; line-height: 1.5; }
    .panel { background: #141c31; border: 1px solid #293654; border-radius: 18px;
             padding: 18px; }
    video { width: 100%; max-height: 65vh; background: #05070d; border-radius: 12px;
            display: block; object-fit: contain; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0; }
    button, select { background: #2f6fed; color: white; border: 0; border-radius: 10px;
                     padding: 11px 14px; font-size: 1rem; cursor: pointer; }
    select { background: #26324d; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #status { font-weight: 600; }
    .hint { font-size: .92rem; }
  </style>
</head>
<body>
<main>
  <h1>📱 Cámara del celular → PC</h1>
  <p>Abre esta página en el celular para enviar su cámara. Déjala abierta mientras transmites.</p>
  <section class="panel">
    <video id="preview" autoplay playsinline muted></video>
    <div class="row">
      <select id="camera" aria-label="Cámara">
        <option value="environment">Cámara trasera</option>
        <option value="user">Cámara frontal</option>
      </select>
      <button id="start">Iniciar transmisión</button>
      <button id="stop" disabled>Detener</button>
    </div>
    <div id="status">Estado: sin transmitir</div>
    <p class="hint">Si el navegador muestra una advertencia de certificado, continúa solo si estás en tu propia red y reconoces la dirección de tu PC.</p>
  </section>
</main>
<script>
const video = document.getElementById('preview');
const startBtn = document.getElementById('start');
const stopBtn = document.getElementById('stop');
const camera = document.getElementById('camera');
const statusEl = document.getElementById('status');
let stream = null, socket = null, timer = null, canvas = document.createElement('canvas');
let busy = false;

function status(text) { statusEl.textContent = 'Estado: ' + text; }

async function start() {
  try {
    stop();
    status('solicitando permiso de cámara…');
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: camera.value },
        width: { ideal: 1280 },
        height: { ideal: 720 },
        frameRate: { ideal: 20, max: 24 }
      }
    });
    video.srcObject = stream;
    await video.play();

    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    socket = new WebSocket(`${protocol}//${location.host}/ws`);
    socket.binaryType = 'arraybuffer';
    socket.onopen = () => {
      status('transmitiendo');
      startBtn.disabled = true;
      stopBtn.disabled = false;
      timer = setInterval(sendFrame, 100); // ~10 FPS para reducir carga de CPU/red
    };
    socket.onerror = () => status('error de conexión. Comprueba que la página del PC siga abierta.');
    socket.onclose = () => {
      if (timer) clearInterval(timer);
      timer = null;
      startBtn.disabled = false;
      stopBtn.disabled = true;
      status('conexión cerrada');
    };
  } catch (err) {
    status('no se pudo iniciar: ' + err.message);
    stop();
  }
}

function sendFrame() {
  if (!stream || !socket || socket.readyState !== WebSocket.OPEN || busy ||
      video.readyState < 2 || !video.videoWidth) return;
  busy = true;
  const maxWidth = 960;
  const scale = Math.min(1, maxWidth / video.videoWidth);
  canvas.width = Math.round(video.videoWidth * scale);
  canvas.height = Math.round(video.videoHeight * scale);
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  canvas.toBlob(async blob => {
    try {
      if (blob && socket && socket.readyState === WebSocket.OPEN) {
        socket.send(await blob.arrayBuffer());
      }
    } finally { busy = false; }
  }, 'image/jpeg', 0.72);
}

function stop() {
  if (timer) clearInterval(timer);
  timer = null;
  if (socket) {
    const oldSocket = socket;
    socket = null;
    if (oldSocket.readyState === WebSocket.OPEN || oldSocket.readyState === WebSocket.CONNECTING)
      oldSocket.close();
  }
  if (stream) stream.getTracks().forEach(track => track.stop());
  stream = null;
  video.srcObject = null;
  startBtn.disabled = false;
  stopBtn.disabled = true;
  status('sin transmitir');
}
startBtn.addEventListener('click', start);
stopBtn.addEventListener('click', stop);
camera.addEventListener('change', () => {
  if (stream) start();
});
window.addEventListener('pagehide', stop);
</script>
</body>
</html>
